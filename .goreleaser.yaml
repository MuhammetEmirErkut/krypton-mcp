version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: krypton
    main: ./cmd/krypton
    binary: krypton
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/krypton-mcp/krypton/internal/version.Version={{.Version}}
      - -X github.com/krypton-mcp/krypton/internal/version.GitCommit={{.Commit}}
      - -X github.com/krypton-mcp/krypton/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
