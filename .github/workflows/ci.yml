name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m

  security:
    name: Security Audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version: '1.23'

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests with Race Detector & Coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

  build:
    name: Multi-Platform Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build for Linux (amd64 & arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o /dev/null ./cmd/krypton
          GOOS=linux GOARCH=arm64 go build -v -o /dev/null ./cmd/krypton

      - name: Build for macOS (amd64 & arm64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -v -o /dev/null ./cmd/krypton
          GOOS=darwin GOARCH=arm64 go build -v -o /dev/null ./cmd/krypton

      - name: Build for Windows (amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -v -o /dev/null ./cmd/krypton
